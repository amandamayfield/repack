[tool.ruff]
line-length = 120
# Generated by makemigrations; don't reformat history.
extend-exclude = ["api/migrations"]

[tool.ruff.format]
# Matches the existing hand-written code.
indent-style = "tab"

[tool.ruff.lint]
# Defaults (pyflakes + core pycodestyle) plus import sorting.
extend-select = ["I"]
# Django/DRF declare config as list class attributes (Meta.fields, ordering,
# permission_classes, ...), which is exactly what RUF012 flags.
ignore = ["RUF012"]
