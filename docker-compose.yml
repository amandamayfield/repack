services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: repack
      POSTGRES_USER: repack
      POSTGRES_PASSWORD: repack
    ports:
      - "127.0.0.1:5432:5432" # localhost only; don't expose the dev DB to the network
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
